[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dickerer-demo"
version = "0.1.0"
description = "A local-model negotiation arena with separate buyer and seller agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.116,<1", "uvicorn>=0.35,<1", "httpx>=0.28,<1", "pydantic>=2.11,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
dickerer-demo = "dickerer_demo.app:main"

[tool.setuptools.packages.find]
include = ["dickerer_demo*"]

[tool.setuptools.package-data]
dickerer_demo = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
