name: Demo checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install '.[test]'
      - run: pytest -q
      - run: node --check dickerer_demo/static/app.js
      - run: node --check dickerer_demo/static/panel.js && node --check extension/bridge.js && node --check extension/background.js
      - run: python scripts/build_extension.py
      - run: php -l deploy/api.php && php -l deploy/index.php
